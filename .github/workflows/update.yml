name: Auto Update Live Sports

on:
  schedule:
    # প্রতি ৩০ মিনিট পর পর স্বয়ংক্রিয়ভাবে চলবে
    - cron: '*/30 * * * *'
  workflow_dispatch: # চাইলে আপনি নিজেও এক ক্লিকে রান করতে পারবেন

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pytz

      - name: Run Scraper & Update live.json
        run: |
          python updater.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -m "Auto update live matches and streams" || exit 0
          git push
